<script>
'use strict';
/* =========================================================
   BOOP — Filme 02 · "Perto demais."
   Um único recuo de câmera: dos pedidos ao todo.
   Cada quadro é função pura de t (seek). A trilha usa a mesma
   linha do tempo. 120 BPM nos trechos com batida.
   ========================================================= */
const DUR = 33;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  outExpo: p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p),
  inExpo: p => p <= 0 ? 0 : Math.pow(2, 10 * p - 10),
  outCubic: p => 1 - Math.pow(1 - p, 3),
  inOutCubic: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  outQuart: p => 1 - Math.pow(1 - p, 4),
  inQuart: p => p * p * p * p,
  inOutQuart: p => p < .5 ? 8 * p * p * p * p : 1 - Math.pow(-2 * p + 2, 4) / 2,
  outBack: p => { const s = 1.9; return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); },
};
const tw = (t, a, b, from, to, e = E.outExpo) => lerp(from, to, e(P(t, a, b)));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
const hash = (a, b) => rng(a * 7919 + b * 104729 + 13)();
const vis = (el, on) => { el.style.visibility = on ? 'visible' : 'hidden'; };
const reveal = (m, t, t0, dur = .6) => { m.firstElementChild.style.transform = `translateY(${135 * (1 - E.outExpo(P(t, t0, t0 + dur)))}%)`; };
const hide = (m, t, t0, dur = .35) => { if (t >= t0) m.firstElementChild.style.transform = `translateY(${-135 * E.inQuart(P(t, t0, t0 + dur))}%)`; };

/* ---------- linha do tempo ---------- */
const T = {
  type: .35, slam: 1.6, wall: 3.6, stop: 5.4, lens: 9.0, pull: 10.5, isl: 14.0,
  conn: 16.8, ring: 19.5, breath: 22.6, open: 23.4, drop: 23.9, boop: 26.9, poke: 27.8, end: 29.4,
};
const HITS = [[1.6,12],[2.1,12],[2.6,14],[2.85,8],[3.1,8],[3.225,6],[3.35,6],[3.475,6],[4.75,8],[5.0,10],[5.125,10],[5.25,12],[23.9,26],[24.4,18],[26.9,16],[27.15,20],[27.8,30]];
function shake(t) {
  let x = 0, y = 0, s = 0;
  HITS.forEach(([h, a], i) => { const d = t - h; if (d < 0 || d > .6) return; const e = a * Math.exp(-d * 9); x += e * Math.sin(d * 58 + i * 1.7); y += e * Math.cos(d * 47 + i * 2.3) * .8; s += a / 700 * Math.exp(-d * 12); });
  if (t >= T.wall && t < T.stop) { const g = rng(Math.floor(t * 30)); const a = 3 + 7 * P(t, T.wall, T.stop); x += (g() - .5) * a; y += (g() - .5) * a; }
  return { x, y, s: 1 + s };
}
const FLASHES = [[1.6,'#FFFDF5',.8],[2.6,'#FFFDF5',.5],[23.9,'#00C2FF',.55],[26.9,'#FFFDF5',.6],[27.8,'#FFFDF5',.45]];

/* ---------- símbolo (olhos) ---------- */
function buildSym(svg, dark) {
  const ringL = dark ? '#0B1B2C' : 'url(#g-ring)', ringR = dark ? '#0B1B2C' : '#00C2FF';
  svg.innerHTML = `
  <path class="crown" style="transform-box:view-box;transform-origin:128px 84px" d="M76.735 27.7407L71.0085 48.5463C71.0085 48.5463 85.8974 47.3904 101.932 55.4815C117.966 63.5725 132.855 84.3781 132.855 84.3781C132.855 84.3781 147.744 64.7284 154.615 60.1049C161.487 55.4815 185.538 48.5463 185.538 48.5463V32.3642L168.359 42.767L177.521 19.6497L160.342 32.3642V19.6497L146.598 32.3642L142.017 0L111.094 38.1435L101.932 10.4028L87.0427 38.1435L76.735 27.7407Z" fill="#FFFDF5"/>
  <path class="ringL" d="M144.308 114.024C144.308 154.328 112.003 187 72.1538 187C32.3044 187 0 154.328 0 114.024C0 73.7211 32.3044 41.0488 72.1538 41.0488C112.003 41.0488 144.308 73.7211 144.308 114.024ZM38.9631 114.024C38.9631 132.564 53.8231 147.593 72.1538 147.593C90.4846 147.593 105.345 132.564 105.345 114.024C105.345 95.4849 90.4846 80.4556 72.1538 80.4556C53.8231 80.4556 38.9631 95.4849 38.9631 114.024Z" fill="${ringL}"/>
  <g class="lid" style="transform-box:view-box;transform-origin:72.15px 114px"><ellipse cx="72.1538" cy="114.024" rx="27.4872" ry="27.3659" fill="#FFFDF5"/><g class="pupil"><ellipse cx="79.0256" cy="111.744" rx="16.0342" ry="15.9634" fill="#1A1A1A"/><ellipse cx="73.2991" cy="106.043" rx="5.7265" ry="5.70122" fill="#FFFDF5"/></g></g>
  <path class="ringR" d="M268 114.024C268 154.328 236.208 187 196.991 187C157.775 187 125.983 154.328 125.983 114.024C125.983 73.7211 157.775 41.0488 196.991 41.0488C236.208 41.0488 268 73.7211 268 114.024ZM164.328 114.024C164.328 132.564 178.952 147.593 196.991 147.593C215.031 147.593 229.655 132.564 229.655 114.024C229.655 95.4849 215.031 80.4556 196.991 80.4556C178.952 80.4556 164.328 95.4849 164.328 114.024Z" fill="${ringR}"/>
  <g class="lid" style="transform-box:view-box;transform-origin:197px 114px"><ellipse cx="196.99" cy="114.32" rx="27.4872" ry="27.3659" fill="#FFFDF5"/><g class="pupil"><ellipse cx="203.863" cy="111.744" rx="16.0342" ry="15.9634" fill="#1A1A1A"/><ellipse cx="198.137" cy="106.043" rx="5.7265" ry="5.70122" fill="#FFFDF5"/></g></g>
  <path class="horn" style="transform-box:view-box;transform-origin:197px 56px" d="M196.991 56.2953C209.733 67.2608 217.776 69.7502 233.641 67.8187L232.808 54.8549L231.975 41.8911L231.142 28.9273L230.309 15.9634L221.98 26.0464L213.65 36.1294L205.321 46.2124L196.991 56.2953Z" fill="url(#g-horn)"/>`;
}
function eyes(svg, lx, ly, lid) {
  $$('.pupil', svg).forEach(p => p.setAttribute('transform', `translate(${lx} ${ly})`));
  $$('.lid', svg).forEach(l => l.style.transform = `scaleY(${Math.max(.04, lid)})`);
}
function look(t, keys) { let x = keys[0][1], y = keys[0][2]; for (let i = 1; i < keys.length; i++) { const k = E.outExpo(P(t, keys[i][0], keys[i][0] + .2)); x = lerp(x, keys[i][1], k); y = lerp(y, keys[i][2], k); } return [x, y]; }
const blink = (t, times) => times.reduce((v, b) => { const k = P(t, b, b + .16); return k > 0 && k < 1 ? Math.min(v, Math.abs(Math.cos(k * Math.PI))) : v; }, 1);

/* =========================================================
   CENAS DOM
   ========================================================= */
const scenes = [];
const scene = (id, a, b, fn) => scenes.push({ el: $('#' + id), a, b, fn });

/* 1 · cursor digitando */
const TYPED = 'precisamos de';
const typeAt = i => T.type + .12 + i * .062;
scene('sc-type', 0, T.slam, t => {
  let n = 0; for (let i = 0; i < TYPED.length; i++) if (t >= typeAt(i)) n = i + 1;
  $('#typed-txt').textContent = TYPED.slice(0, n);
  const typing = t < typeAt(TYPED.length - 1) + .1;
  $('#caret').style.opacity = t < T.type ? 0 : (typing ? 1 : (Math.floor((t - 1.2) / .16) % 2 ? .15 : 1));
});

/* 2 · sintomas */
const SLAMS = [
  [1.6, 'mais<br>posts.', 'osso', 280], [2.1, 'um site<br>novo.', 'navy', 250], [2.6, 'tráfego.', 'ciano', 270],
  [2.85, 'uma<br>marca<br>nova.', 'osso', 240], [3.1, 'campanha.', 'navy', 190],
  [3.225, 'reels.', 'stack', 230], [3.35, 'logo.', 'stack', 260], [3.475, 'promo.', 'stack', 240],
];
const BG = { osso: ['#FFFDF5', '#0B1B2C'], navy: ['#0B1B2C', '#FFFDF5'], ciano: ['#00C2FF', '#0B1B2C'] };
SLAMS.forEach(([, txt, , size], i) => { const d = document.createElement('div'); d.className = 'w big' + (i === 6 ? ' outline' : ''); d.innerHTML = txt; d.style.fontSize = size + 'px'; $('#slams').appendChild(d); });
scene('sc-slam', T.slam, T.wall, t => {
  const ws = $$('#slams .w');
  let cur = 0; SLAMS.forEach(([s], i) => { if (t >= s) cur = i; });
  const base = SLAMS[cur][2] === 'stack' ? 'navy' : SLAMS[cur][2];
  $('#sc-slam').style.background = BG[base][0];
  SLAMS.forEach(([s, , kind], i) => {
    const w = ws[i];
    const stacked = kind === 'stack' || (i === 4 && t >= 3.225);
    const on = t >= s && (i === cur || stacked);
    vis(w, on); if (!on) return;
    const k = E.outExpo(P(t, s, s + .32));
    const lines = w.innerHTML.split('<br>').length;
    const h = parseFloat(w.style.fontSize) * .82 * lines;
    const r = rng(i * 31 + 5);
    const rot = kind === 'stack' ? (r() - .5) * 16 : 0;
    const dx = kind === 'stack' ? (r() - .5) * 240 : 0, dy = kind === 'stack' ? (r() - .5) * 700 : 0;
    w.style.top = (960 - h / 2 + dy) + 'px';
    w.style.color = kind === 'stack' ? (i === 5 ? 'var(--ciano)' : 'var(--osso)') : BG[kind][1];
    w.style.transform = `translate(${dx}px,0) scale(${lerp(1.35, 1, k)}) rotate(${rot}deg) skewX(${-12 * (1 - k)}deg)`;
  });
});

/* 3 · silêncio */
scene('sc-quiet', T.stop, T.lens, t => {
  const ms = $$('#sc-quiet .m');
  reveal(ms[0], t, 6.1, .9); reveal(ms[1], t, 7.4, .9);
  $('#sc-quiet .c').style.transform = `translate(var(--sx),var(--sy)) scale(${lerp(1, 1.035, P(t, 5.9, 9))})`;
});

/* 4 · mundo navy contínuo (9 → 26.9) + parede de ruído (3.6 → 5.4) */
scene('sc-world', T.wall, T.boop, t => {
  const inv = wallInvert(t);
  $('#sc-world').style.background = inv ? 'var(--osso)' : 'var(--navy)';

/* =========================================================
   CAMPO — canvas: parede → pontos → ilhas → olhos
   ========================================================= */
const cv = $('#field'), ctx = cv.getContext('2d');
const LAYER = [0, 1, 2].map(() => Object.assign(document.createElement('canvas'), { width: 1080, height: 1920 }));
const CLUSTERS = [
  { k: 'Marca', c: [270, 650], w: ['uma marca nova.', 'logo novo.', 'rebranding.', 'paleta.', 'slogan.', 'naming.'] },
  { k: 'Conteúdo', c: [810, 740], w: ['mais posts.', 'reels.', 'stories.', 'carrossel.', 'vídeo.', 'newsletter.'] },
  { k: 'Digital', c: [230, 1110], w: ['um site novo.', 'landing page.', 'SEO.', 'e-commerce.', 'app.', 'checkout.'] },
  { k: 'Vendas', c: [860, 1220], w: ['tráfego.', 'anúncio.', 'promo.', 'cupom.', 'leads.', 'funil.'] },
  { k: 'Produto', c: [300, 1600], w: ['lançamento.', 'catálogo.', 'preço.', 'coleção.', 'kit.', 'combo.'] },
  { k: 'Operação', c: [790, 1660], w: ['planilha.', 'automação.', 'sistema.', 'processo.', 'estoque.', 'atendimento.'] },
];
const KNOT = [540, 1130];
const SYM = { x: 111.2, y: 595.2, s: 3.2 };
const LC = [SYM.x + 72.15 * SYM.s, SYM.y + 114.02 * SYM.s], RC = [SYM.x + 196.99 * SYM.s, SYM.y + 114.02 * SYM.s];
const PUPIL = [SYM.x + 79.03 * SYM.s, SYM.y + 111.74 * SYM.s];
const PER = 36;
const F = [];
const ROWS = [];

function initField() {
  const R = rng(42);
  CLUSTERS.forEach((cl, ci) => {
    for (let j = 0; j < PER; j++) {
      const a = R() * Math.PI * 2, r = 24 + Math.sqrt(R()) * 88;
      F.push({ id: F.length, ci, j, w: cl.w[j % cl.w.length], z: Math.floor(R() * 3), ph: R() * 6.28, d: R(),
        scat: [Math.cos(a) * r, Math.sin(a) * r * .8], grid: [((j % 6) - 2.5) * 21, (Math.floor(j / 6) - 2.5) * 21] });
    }
  });
  // parede: linhas de tamanhos diferentes, cada uma um letreiro correndo
  const sizes = [132, 84, 168, 66, 118, 150, 76, 104, 176, 62, 138, 92, 158, 72, 124, 98, 146];
  const order = [...F].sort((a, b) => hash(a.id, 1) - hash(b.id, 1));
  let y = 0, fi = 0;
  for (let r = 0; y < 2050; r++) {
    const s = sizes[r % sizes.length]; y += s * (r ? .9 : .84);
    const row = { y, s, v: (r % 2 ? 1 : -1) * (160 + (r * 37 % 5) * 55), items: [], W: 0 };
    ctx.font = `600 ${s}px Poppins`; ctx.letterSpacing = `${-.05 * s}px`;
    while (row.W < 1950 && fi < order.length) {
      const f = order[fi++]; const w = ctx.measureText(f.w).width;
      f.row = r; f.x0 = row.W; f.fw = w; f.fs = s; row.items.push(f); row.W += w + s * .38;
    }
    ROWS.push(row);
  }
  // o que sobrou começa fora do quadro (e entra quando a câmera recua)
  for (; fi < order.length; fi++) {
    const f = order[fi], a = hash(f.id, 2) * Math.PI * 2, r = 1300 + hash(f.id, 3) * 1400;
    f.row = -1; f.fs = 60 + hash(f.id, 4) * 110; f.off = [540 + Math.cos(a) * r, 960 + Math.sin(a) * r];
  }
  // alvos nos anéis dos olhos
  const L = F.filter((_, i) => i % 2 === 0), Rr = F.filter((_, i) => i % 2 === 1);
  [[L, LC, .31], [Rr, RC, -.26]].forEach(([arr, c, spin]) => {
    const rad = [124, 160, 194, 224], cnt = [21, 26, 29, 32];
    let k = 0;
    rad.forEach((rr, ri) => { for (let n = 0; n < cnt[ri] && k < arr.length; n++, k++) { arr[k].ring = { c, r: rr, a: n / cnt[ri] * Math.PI * 2 + ri * .4, spin }; } });
  });
}

const wallTime = t => Math.min(t, T.stop);
const wallStep = t => Math.floor((wallTime(t) - T.wall) / .125);
function wallInvert(t) { if (t < T.wall || t >= T.stop) return false; const s = wallStep(t); return s === 6 || s === 10 || (s >= 11 && s % 2 === 1); }
function wallPos(f, t) {
  if (f.row < 0) return [f.off[0], f.off[1], f.fs];
  const row = ROWS[f.row], tt = wallTime(t) - T.wall;
  const off = row.v * tt * (1 + tt * .9);
  const x = ((f.x0 + off) % row.W + row.W) % row.W - 380;
  return [x + f.fw / 2, row.y - f.fs * .34, f.fs];
}
function islandCenter(ci, t) { const c = CLUSTERS[ci].c, A = 16 * (1 - P(t, T.conn, T.conn + 1)); return [c[0] + A * Math.sin(t * 1.3 + ci * 2), c[1] + A * Math.cos(t * 1.05 + ci)]; }
function islandPos(f, t) {
  const c = islandCenter(f.ci, t), g = E.outExpo(P(t, 17.6 + f.ci * .08, 18.5 + f.ci * .08));
  const j = 5 * (1 - P(t, T.conn, T.conn + .8));
  return [c[0] + lerp(f.scat[0], f.grid[0], g) + j * Math.sin(t * 7 + f.ph), c[1] + lerp(f.scat[1], f.grid[1], g) + j * Math.cos(t * 6 + f.ph)];
}
function ringPos(f, t) { const r = f.ring, a = r.a + (t - T.ring) * r.spin; return [r.c[0] + Math.cos(a) * r.r, r.c[1] + Math.sin(a) * r.r]; }

function drawField(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, 1080, 1920);
  if (t < T.wall || (t >= T.stop && t < T.lens) || t >= 22.9) return;
  const live = t < T.stop;
  const inv = wallInvert(t), step = wallStep(t);
  const zoom = lerp(1, .1, E.inOutCubic(P(t, T.pull, 12.9)));
  const dofK = Math.sin(Math.PI * P(t, T.pull, 13.8));
  const dim = live ? 1 : lerp(.16, 1, P(t, T.pull, 13));
  const ink = inv ? '#0B1B2C' : '#FFFDF5';

  for (let z = 0; z < 3; z++) {
    // cada camada de profundidade é desenhada inteira e desfocada de uma vez
    const blur = dofK > .02 && z ? dofK * z * 5 : 0;
    const g = blur ? LAYER[z].getContext('2d') : ctx;
    if (blur) { g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, 1080, 1920); }
    for (const f of F) {
      if (f.z !== z) continue;
      const [wx, wy, ws] = wallPos(f, t);
      const zx = 540 + (wx - 540) * zoom, zy = 960 + (wy - 960) * zoom;
      const m = E.inOutCubic(P(t, 11.4 + f.d * .8, 13.3 + f.d * .6));
      let [x, y] = [zx, zy];
      if (m > 0) { const ip = islandPos(f, t); x = lerp(zx, ip[0], m); y = lerp(zy, ip[1], m); }
      const rk = E.inOutCubic(P(t, T.ring + .1 + f.d * .7, T.ring + 1.3 + f.d * .7));
      if (rk > 0) { const rp = ringPos(f, t); x = lerp(x, rp[0], rk); y = lerp(y, rp[1], rk); }
      const size = ws * zoom * (1 - m);
      const ta = clamp((size - 8) / 14);
      const fade = 1 - P(t, 22.25, 22.7);
      if (ta > 0.01) {
        let col = ink;
        if (live && hash(f.id, step + 50) < .13) col = '#00C2FF';
        g.globalAlpha = ta * dim * fade;
        g.font = `600 ${size.toFixed(1)}px Poppins`; g.letterSpacing = `${(-.05 * size).toFixed(2)}px`;
        g.textAlign = 'center'; g.textBaseline = 'middle';
        if (live && f.row % 3 === 1) { g.strokeStyle = col; g.lineWidth = 2.5; g.strokeText(f.w, x, y); }
        else { g.fillStyle = col; g.fillText(f.w, x, y); }
      }
      if (ta < 1 && t >= T.pull) {
        g.globalAlpha = (1 - ta) * dim * fade;
        g.fillStyle = '#FFFDF5';
        const rr = lerp(3.4, 5.2, rk);
        g.beginPath(); g.arc(x, y, rr, 0, Math.PI * 2); g.fill();
      }
    }
    if (blur) { g.globalAlpha = 1; ctx.filter = `blur(${blur.toFixed(1)}px)`; ctx.globalAlpha = 1; ctx.drawImage(LAYER[z], 0, 0); ctx.filter = 'none'; }
  }
  ctx.filter = 'none'; ctx.globalAlpha = 1;

  // falhas de sinal no fim da parede
  if (live && t > 4.4) {
    const g = rng(Math.floor(t * 16) + 900);
    const n = 2 + Math.floor(g() * 3 * P(t, 4.4, 5.4));
    for (let i = 0; i < n; i++) { const y = g() * 1920, h = 16 + g() * 120, dx = (g() - .5) * 180; ctx.drawImage(cv, 0, y, 1080, h, dx, y, 1080, h); }
  }

  // conexões: do nó para cada ilha, depois o anel externo
  if (t >= T.conn && t < 20.4) {
    const fade = 1 - P(t, 19.7, 20.3);
    ctx.lineCap = 'round';
    CLUSTERS.forEach((cl, i) => {
      const p = E.outCubic(P(t, 16.9 + i * .2, 17.25 + i * .2)); if (!p) return;
      const c = islandCenter(i, t);
      ctx.strokeStyle = '#00C2FF'; ctx.lineWidth = 3; ctx.globalAlpha = fade;
      ctx.beginPath(); ctx.moveTo(KNOT[0], KNOT[1]); ctx.lineTo(lerp(KNOT[0], c[0], p), lerp(KNOT[1], c[1], p)); ctx.stroke();
    });
    const ring = [0, 1, 3, 5, 4, 2, 0];
    const hp = E.inOutCubic(P(t, 18.2, 19.0)) * 6;
    ctx.strokeStyle = '#FFFDF5'; ctx.lineWidth = 1.5; ctx.globalAlpha = .45 * fade;
    ctx.beginPath();
    for (let i = 0; i < 6 && i < hp; i++) {
      const a = islandCenter(ring[i], t), b = islandCenter(ring[i + 1], t), k = Math.min(1, hp - i);
      ctx.moveTo(a[0], a[1]); ctx.lineTo(lerp(a[0], b[0], k), lerp(a[1], b[1], k));
    }
    ctx.stroke(); ctx.globalAlpha = 1;
  }

  // varredura
  if (t >= 15.0 && t < 15.9) {
    const y = lerp(-40, 1960, E.inOutCubic(P(t, 15.0, 15.85)));
    const gr = ctx.createLinearGradient(0, y - 120, 0, y);
    gr.addColorStop(0, 'rgba(0,194,255,0)'); gr.addColorStop(1, 'rgba(0,194,255,.22)');
    ctx.fillStyle = gr; ctx.fillRect(0, y - 120, 1080, 120);
    ctx.fillStyle = '#00C2FF'; ctx.fillRect(0, y, 1080, 2);
  }

  // o nó: o que ninguém pediu para olhar
  if (t >= 15.75) {
    const to = E.inOutCubic(P(t, 20.4, 21.8));
    const x = lerp(KNOT[0], PUPIL[0], to), y = lerp(KNOT[1], PUPIL[1], to);
    const born = E.outBack(P(t, 15.75, 16.1));
    const r = lerp(15, 51, to) * born;
    const beat = (t - 15.75) % .6;
    ctx.globalAlpha = (1 - P(t, 22.3, 22.6));
    if (to < 1) { const k = beat / .6; ctx.strokeStyle = '#00C2FF'; ctx.lineWidth = 2.5; ctx.globalAlpha *= (1 - k) * (1 - to); ctx.beginPath(); ctx.arc(x, y, r + k * 90, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1 - P(t, 22.3, 22.6); }
    ctx.fillStyle = '#00C2FF';
    ctx.beginPath(); ctx.arc(x, y, r * (1 + .25 * Math.max(0, 1 - beat / .15) * (1 - to)), 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

/* sobreposições do campo */
const islWrap = $('#isls');
CLUSTERS.forEach(cl => { const d = document.createElement('div'); d.className = 'isl lbl'; d.textContent = cl.k; islWrap.appendChild(d); });
buildSym($('#sym'), false);
function drawOverlay(t) {
  // "mais." estroboscópico no pico do ruído
  const mais = $('#mais');
  const mOn = [4.75, 5.0, 5.125, 5.25].some(h => t >= h && t < h + .07);
  vis(mais, mOn); mais.style.color = wallInvert(t) ? 'var(--navy)' : 'var(--ciano)';
  // a lente

  if (lensOn) {

    c.style.strokeDasharray = L; c.style.strokeDashoffset = L * (1 - E.inOutCubic(P(t, 9.1, 9.6)));
    const s = lerp(1, .06, E.inOutCubic(P(t, T.pull, 11.4)));
    $('#lens').style.transformOrigin = '540px 960px';

  });

    $('.crown', sym).style.transform = `scaleY(${E.outBack(P(t, 22.3, 22.75))})`;
    $('.horn', sym).style.transform = `scale(${E.outBack(P(t, 22.45, 22.85))})`;
    const open = t < T.open ? .05 : E.outBack(P(t, T.open, T.open + .3));
    const [lx, ly] = look(t, [[0, 0, 0], [24.9, -8, 2], [25.4, 8, -2], [25.9, 0, 5], [26.4, 0, 0]]);

    $$('#olhe .echo').forEach((e, i) => { e.style.opacity = P(t, 24.5 + i * .12, 24.7 + i * .12) * (.9 - i * .35); e.style.transform = `translateY(${(t - 24.4) * (60 + i * 40)}px)`; });

/* ---------- quadro ---------- */
const stageEl = $('#stage'), flashEl = $('#flash'), blackEl = $('#black'), grainEl = $('#grain');
function seek(t) {

  stageEl.style.setProperty('--sy', sh.y.toFixed(2) + 'px');

  drawField(t);

window.seek = seek; window.DUR = DUR;

/* =========================================================
   TRILHA — síntese determinística
   ruído em ré menor → clareza em ré maior → sonic logo
   ========================================================= */
async function renderAudio(sr = 48000) {
  const ac = new OfflineAudioContext(2, Math.ceil(DUR * sr), sr);
  const R = rng(2026);
  const noise = ac.createBuffer(1, sr * 6, sr);
  { const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = R() * 2 - 1; }
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = .003; comp.release.value = .18; comp.knee.value = 8;
  const master = ac.createGain(); master.connect(comp); comp.connect(ac.destination);
  const G = master.gain; G.setValueAtTime(.9, 0);
  // silêncios como corte
  G.setValueAtTime(.9, T.stop - .004); G.linearRampToValueAtTime(0, T.stop); G.setValueAtTime(0, 5.95); G.linearRampToValueAtTime(.9, 6.05);
  G.setValueAtTime(.9, T.breath - .01); G.linearRampToValueAtTime(0, T.breath + .02); G.setValueAtTime(0, T.open - .06); G.linearRampToValueAtTime(.9, T.open);
  G.setValueAtTime(.9, 32.0); G.linearRampToValueAtTime(0, 32.95);

  const verb = ac.createConvolver();
  { const L = sr * 2.8, ir = ac.createBuffer(2, L, sr); for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < L; i++) d[i] = (R() * 2 - 1) * Math.pow(1 - i / L, 3.4); } verb.buffer = ir; }
  const vg = ac.createGain(); vg.gain.value = .34; verb.connect(vg); vg.connect(master);

  // barramento do caos: filtrado quando a câmera se afasta (e abafado "atrás do vidro")
  const chaosLP = ac.createBiquadFilter(); chaosLP.type = 'lowpass'; chaosLP.Q.value = .7;
  const chaos = ac.createGain(); chaos.connect(chaosLP); chaosLP.connect(master);
  chaosLP.frequency.setValueAtTime(18000, 0);

  { const o = osc('sine', BLINK, .05, 1100), g = ac.createGain(); o.frequency.exponentialRampToValueAtTime(260, BLINK + .03); env(g, BLINK, .001, .42, .045); o.connect(g); route(g, 1, 0, .1);

const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.documentElement.classList.add('render');
function fit() {

  stageEl.style.transform = `scale(${s})`;
  stageEl.style.left = RENDER ? '0' : (innerWidth - 1080 * s) / 2 + 'px';

addEventListener('resize', fit); fit();
window.ready = Promise.all([document.fonts.load('600 100px Poppins'), document.fonts.load('500 100px Poppins')])

if (!RENDER) {

  $('#restart').addEventListener('click', () => jump(0));
  bar.addEventListener('click', e => { const r = bar.getBoundingClientRect(); jump((e.clientX - r.left) / r.width * DUR); });
  bar.addEventListener('keydown', e => { if (e.key === 'ArrowRight') jump(now() + 1); if (e.key === 'ArrowLeft') jump(now() - 1); });
  addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); if ($('#cover')) $('#cover').click(); else playBtn.click(); } });
}
</script>
</body>
</html>
