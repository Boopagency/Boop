<script id="frag" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform float uT;
uniform vec3 uF;   // lápis: x do eixo, y da ponta de cima, y da ponta de baixo
uniform vec4 uS;   // gota ciano: cx, cy, raio, visível
uniform vec4 uK;   // ponta quebrada, -, brilho, flash

vec3 lin(vec3 c){ return pow(c, vec3(2.2)); }
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float hash3(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
float vnoise(vec3 p){
  vec3 i = floor(p), f = fract(p); f = f*f*(3. - 2.*f);
  return mix(mix(mix(hash3(i), hash3(i+vec3(1,0,0)), f.x), mix(hash3(i+vec3(0,1,0)), hash3(i+vec3(1,1,0)), f.x), f.y),
             mix(mix(hash3(i+vec3(0,0,1)), hash3(i+vec3(1,0,1)), f.x), mix(hash3(i+vec3(0,1,1)), hash3(i+vec3(1,1,1)), f.x), f.y), f.z);
}

const float LEAN = 0.06;          // o corpo do lápis vem um pouco para a câmera
const float SA = 0.2874, CA = 0.9578;  // meio ângulo do cone apontado (16,7°)
const float HEX = 0.27;           // apótema do corpo sextavado
const float GRAPH = 0.24;         // altura da ponta de grafite

// coordenadas locais: ponta na origem, corpo subindo em +y
vec3 toPencil(vec3 p, float tipY, float dir, float spin){
  p -= vec3(uF.x, tipY, 0.);
  p.y *= dir;
  float cl = cos(LEAN), sl = sin(LEAN);
  p.yz = mat2(cl, -sl, sl, cl) * p.yz;
  float c = cos(spin), s = sin(spin);
  p.xz = mat2(c, s, -s, c) * p.xz;
  return p;
}
float sdHex(vec2 p, float r){
  const vec3 k = vec3(-0.866025404, 0.5, 0.577350269);
  p = abs(p);
  p -= 2.0*min(dot(k.xy, p), 0.0)*k.xy;
  p -= vec2(clamp(p.x, -k.z*r, k.z*r), r);
  return length(p)*sign(p.y);
}
vec2 pencilParts(vec3 q){
  float rr = uK.x;
  vec2 w = vec2(length(q.xz), q.y - rr);
  float cone = (dot(w, vec2(SA, CA)) < 0. ? length(w) : dot(w, vec2(CA, -SA))) - rr;
  float hex = sdHex(q.xz, HEX - .005) - .005;
  return vec2(cone, hex);
}
float sdPencil(vec3 q){ vec2 d = pencilParts(q); return max(d.x, d.y) * .9; }
vec3 qTop(vec3 p){ return toPencil(p, uF.y, 1., .35); }
vec3 qBot(vec3 p){ return toPencil(p, uF.z, -1., .55); }
float sdBall(vec3 p){ return length(p - vec3(uS.xy, 0.)) - uS.z; }

vec2 map(vec3 p){
  float f = min(sdPencil(qTop(p)), sdPencil(qBot(p)));
  float b = uS.w > .5 ? sdBall(p) : 1e3;
  return f < b ? vec2(f, 1.) : vec2(b, 2.);
}
vec3 nrm(vec3 p){
  const vec2 e = vec2(1., -1.) * .0005;
  return normalize(e.xyy*map(p + e.xyy).x + e.yyx*map(p + e.yyx).x + e.yxy*map(p + e.yxy).x + e.xxx*map(p + e.xxx).x);
}

const vec3 L1 = vec3(-0.4851, 0.3639, 0.7954);   // principal, frontal pela esquerda
const vec3 L2 = vec3(0.2611, 0.8704, -0.4178);   // recorte, de cima e de trás

vec3 env(vec3 R){
  vec3 e = lin(vec3(.86, .92, 1.)) * smoothstep(.7, .98, R.y) * 1.1;
  e += lin(vec3(.86, .92, 1.)) * smoothstep(.92, .995, dot(R, L1)) * .8;
  e += lin(vec3(27., 63., 224.)/255.) * (.5*smoothstep(.2, -.8, R.y) + .25*smoothstep(.3, .9, abs(R.x)));
  return e;
}

vec3 background(vec2 w){
  vec2 v = (w - vec2(0., .04)) * vec2(1.05, .62);
  float r = length(v);
  vec3 c = mix(lin(vec3(10., 23., 64.)/255.), lin(vec3(8., 8., 10.)/255.), smoothstep(.04, .82, r));
  c += lin(vec3(.10, .16, .33)) * .14 * exp(-dot(w - vec2(-.12, 1.05), w - vec2(-.12, 1.05)) * 2.2);
  for (int i = 0; i < 11; i++){
    float fi = float(i);
    vec2 pos = vec2(hash(vec2(fi, 1.3))*1.3 - .65, hash(vec2(fi, 7.1))*2.1 - 1.05);
    pos += vec2(sin(uT*.13 + fi), cos(uT*.11 + fi*1.7)) * .02;
    float rad = .03 + .07*hash(vec2(fi, 3.7));
    float d = length(w - pos);
    float disc = smoothstep(rad, rad - .008, d);
    float ring = disc - smoothstep(rad - .006, rad - .014, d);
    vec3 bc = mix(lin(vec3(27., 63., 224.)/255.), lin(vec3(0., 212., 245.)/255.), hash(vec2(fi, 9.2)));
    c += bc * (disc*.018 + ring*.012) * smoothstep(.12, .5, abs(w.x - uF.x) + abs(w.y - .06)*.3);
  }
  return c;
}

vec3 shadePencil(vec3 p, vec3 n, vec3 rd){
  vec3 qt = qTop(p), qb = qBot(p);
  vec3 q = sdPencil(qt) < sdPencil(qb) ? qt : qb;
  vec2 parts = pencilParts(q);
  vec3 V = -rd, R = reflect(rd, n);
  float nv = max(dot(n, V), 0.), nl = dot(n, L1);
  float fr = .04 + .96*pow(1. - nv, 5.);
  float rim = pow(1. - nv, 2.5) * max(dot(n, L2) + .3, 0.);
  vec3 amb = lin(vec3(.10, .16, .36)) * (.5 + .5*n.y);
  vec3 col;
  if (parts.y > parts.x - .0008){
    // laca ciano do corpo
    vec3 base = lin(vec3(0., 212., 245.)/255.);
    col = base * (max(nl, 0.)*.85 + .18 + amb*1.5);
    vec3 e = env(R) * vec3(.55, .8, .9);
    col = mix(col, e, fr*.6) + e*.07;
    col += pow(max(dot(R, L1), 0.), 140.) * 2.5 + vec3(1.) * rim * .25;
  } else if (q.y < GRAPH + .006*sin(atan(q.z, q.x)*3.)){
    // grafite
    vec3 g = lin(vec3(.17, .17, .19));
    col = g * (max(nl, 0.)*.9 + .2) + amb*g;
    col += pow(max(dot(R, L1), 0.), 30.) * .35 + env(R) * fr * .5 + vec3(.8, .9, 1.) * rim * .35;
  } else {
    // madeira apontada
    float grain = vnoise(vec3(q.x*70., q.y*5., q.z*70.)) * .6 + vnoise(vec3(q.x*220., q.y*14., q.z*220.)) * .4;
    vec3 wood = lin(vec3(.86, .71, .54)) * (.78 + .32*grain);
    float dif = clamp((nl + .3) / 1.3, 0., 1.);
    col = wood * (dif*1.05 + amb*.8) + wood * vec3(.9, .4, .2) * smoothstep(.0, .3, dif) * (1. - smoothstep(.3, .7, dif)) * .12;
    col += vec3(1., .96, .9) * rim * .4;
  }
  // a luz cai para as pontas de fora do quadro
  col *= mix(1., .5, smoothstep(.45, 1.1, abs(p.y - .06)));
  // brilho ciano entre as pontas quando estão perto
  float dm = length(p - vec3(uF.x, (uF.y + uF.z)*.5, 0.));
  col += lin(vec3(0., 212., 245.)/255.) * exp(-dm*18.) * uK.z * .35;
  if (uS.w > .5){
    float db = max(length(p - vec3(uS.xy, 0.)) - uS.z, 0.);
    col += lin(vec3(0., 212., 245.)/255.) * max(dot(n, normalize(vec3(uS.xy, 0.) - p)), 0.) * exp(-db*14.) * .8;
  }
  return col;
}

vec3 shadeBall(vec3 p, vec3 n, vec3 rd){
  vec3 V = -rd;
  float nv = max(dot(n, V), 0.);
  float fr = .04 + .96*pow(1. - nv, 5.);
  vec3 cy = lin(vec3(0., 212., 245.)/255.);
  vec3 q = (p - vec3(uS.xy, 0.)) / uS.z;
  vec3 body = mix(lin(vec3(0., .2, .5)), cy, clamp(.3 + .55*nv + .35*smoothstep(.6, -.9, q.y), 0., 1.));
  float caus = exp(-dot(q.xy - vec2(-.16, -.5), q.xy - vec2(-.16, -.5)) * 6.);
  body += cy * caus * .75 + vec3(.55, 1., 1.) * caus*caus * .5;
  vec3 R = reflect(rd, n);
  vec3 col = body*(1. - fr) + env(R)*fr + env(R)*.05;
  col += pow(max(dot(R, L1), 0.), 200.)*5. + cy * uK.w;
  return col;
}

void main(){
  vec2 w = (gl_FragCoord.xy - uRes*.5) / (uRes.y*.5);
  vec3 ro = vec3(0., 0., 6.);
  vec3 rd = normalize(vec3(w, 0.) - ro);
  vec3 col = background(w);
  float dm = length(w - vec2(uF.x, (uF.y + uF.z)*.5));
  col += lin(vec3(0., 212., 245.)/255.) * exp(-dm*9.) * .06 * uK.z;
  float t = 5.0, hitId = 0., best = 1e3, bestT = 0., bestId = 0.;
  for (int i = 0; i < 120; i++){
    vec2 h = map(ro + rd*t);
    if (h.x < best){ best = h.x; bestT = t; bestId = h.y; }
    if (h.x < .0003){ hitId = h.y; break; }
    t += h.x;
    if (t > 7.5) break;
  }
  float px = 1.25 / (uRes.y*.5);
  float cover = hitId > .5 ? 1. : smoothstep(px, 0., best);
  if (cover > 0.){
    float tt = hitId > .5 ? t : bestT;
    float id = hitId > .5 ? hitId : bestId;
    vec3 p = ro + rd*tt;
    vec3 n = nrm(p);
    vec3 s = id < 1.5 ? shadePencil(p, n, rd) : shadeBall(p, n, rd);
    col = mix(col, s, cover);
  }
  if (uS.w > .5){
    float d = length(w - uS.xy) - uS.z;
    col += lin(vec3(0., 212., 245.)/255.) * exp(-max(d, 0.)*16.) * .25 * (1. + 2.*uK.w);
  }
  col = col / (1. + col*.1) * 1.05;
  col = pow(max(col, 0.), vec3(1./2.2));
  col += (hash(gl_FragCoord.xy + fract(uT)) - .5) / 255.;
  gl_FragColor = vec4(col, 1.);
}
</script>

<script src="vendor/gsap.min.js"></script>
<script>
const W = 1080, H = 1920, FPS = 30, DUR = 24;
const $ = s => document.querySelector(s);
const RENDER = new URLSearchParams(location.search).has('render');
const clamp01 = v => Math.min(1, Math.max(0, v));
const prog = (t, a, b) => clamp01((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const E = n => gsap.parseEase(n);
const expoOut = E('expo.out'), quartIO = E('power3.inOut'), p2i = E('power2.in'), p2o = E('power2.out'), p3i = E('power3.in');
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- WebGL: macro do dedo e da esfera ---------- */
const cv = $('#gl');
const gl = cv.getContext('webgl', { preserveDrawingBuffer: true, antialias: false });
function shader(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prg = gl.createProgram();
gl.attachShader(prg, shader(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
gl.attachShader(prg, shader(gl.FRAGMENT_SHADER, $('#frag').textContent));
gl.linkProgram(prg); gl.useProgram(prg);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const U = {}; for (const n of ['uRes', 'uT', 'uF', 'uS', 'uK']) U[n] = gl.getUniformLocation(prg, n);
gl.viewport(0, 0, W, H); gl.uniform2f(U.uRes, W, H);

const PXU = 960, wx = x => (x - 540) / PXU, wy = y => (960 - y) / PXU;
// posição e vão medidos no último quadro do vídeo real (6,77 s), em escala 1080×1920
const AXIS = wx(552), MEET = wy(941), GREAL = .111, G1 = .012, BEAD = .046;
const SYM = { x: 540, y: 860, s: 2.6 };
const PUP = { x: SYM.x + (79.0256 - 134) * SYM.s, y: SYM.y + (111.744 - 93.5) * SYM.s, r: 16.0342 * SYM.s };

// tempo "vivo" da cena: para nos congelamentos (7–15 s e 17,5–18 s)
// até 7 s é o vídeo real; o CG congela até 8 s, volta a se mexer no celular e congela de novo no feed
const drift = t => t < 8 ? 7 : t < 10.5 ? t - 1 : t < 15 ? 9.5 : t < 17.5 ? t - 5.5 : t < 18 ? 12 : t - 6;

function macroState(t){
  const d = drift(t);
  const trem = t >= 8 && t < 10.5 ? .6 * prog(t, 8, 8.6) : (t >= 15 && t < 17.5 ? .6 * prog(t, 15, 15.6) : 0);
  let gap = t < 8 ? GREAL : lerp(GREAL, G1, expoOut(prog(t, 8, 10.5)));
  let rec = 0, exit = 0, blunt = .03;
  const dt = t - 18;
  if (t >= 17.96) gap = lerp(G1, 0, p2i(prog(t, 17.96, 18)));
  if (dt >= 0){  // as pontas batem, quebram e recuam com mola
    rec = .05 * (1 - Math.exp(-dt * 22)) + .022 * Math.exp(-dt * 5) * Math.sin(2 * Math.PI * 3.2 * dt);
    blunt = .045;
    exit = p3i(prog(t, 18.5, 18.95)) * 1.8;
  }
  const j1 = (Math.sin(d * 7.3 + 1) * .0015 + Math.sin(d * 3.1) * .0007) * trem;
  const j2 = (Math.sin(d * 5.9 + 2) * .0013 + Math.sin(d * 2.3) * .0006) * trem;
  let cx = AXIS, cy = MEET, r = 0;
  if (dt >= 0) r = BEAD * E('back.out(2.2)')(prog(t, 18, 18.2));
  if (t >= 18.6){
    const k = quartIO(prog(t, 18.6, 19.0)), u = 1 - k;
    const x0 = AXIS, y0 = MEET, x2 = wx(PUP.x), y2 = wy(PUP.y);
    const x1 = lerp(x0, x2, .3) - .08, y1 = Math.max(y0, y2) + .14;
    cx = u*u*x0 + 2*u*k*x1 + k*k*x2; cy = u*u*y0 + 2*u*k*y1 + k*k*y2;
    r = lerp(BEAD, PUP.r / PXU, k);
  }
  return {
    d, contactY: 960 - MEET * PXU,
    F: [AXIS + (Math.sin(d * 9.1) * .0008) * trem, MEET + gap / 2 + rec + exit + j1, MEET - gap / 2 - rec - exit - j2],
    S: [cx, cy, r, dt >= 0 && t < 19 ? 1 : 0],
    K: [blunt, 0, 1 - Math.min(1, gap / .3) + (dt > 0 ? Math.exp(-dt * 3) * .6 : 0), dt > 0 ? Math.exp(-dt * 11) * .7 : 0]
  };
}
function drawGL(m){
  gl.uniform1f(U.uT, m.d);
  gl.uniform3f(U.uF, ...m.F);
  gl.uniform4f(U.uS, ...m.S);
  gl.uniform4f(U.uK, ...m.K);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ---------- Feed de posts genéricos ---------- */
const feed = $('#feed'), scroller = $('#scroller'), macro = $('#macro'), vStd = $('#vblurStd');
const NPOSTS = 10; // o post 0 e o post 10 são a cena macro
(() => {
  const r = rng(7), tone = () => Math.round(46 + r() * 60);
  for (let i = 1; i < NPOSTS; i++){
    const p = document.createElement('div'); p.className = 'post'; p.style.top = i * 1920 + 'px';
    const a = tone(), b = tone(), c = tone() + 30;
    p.style.background = `radial-gradient(circle at ${20 + r() * 60}% ${25 + r() * 30}%, rgb(${c},${c},${c}) 0, transparent 46%), linear-gradient(170deg, rgb(${a},${a},${a + 4}), rgb(${b},${b},${b + 4}))`;
    const s = document.createElement('i'), sw = 460 + r() * 200, sh = 520 + r() * 260, st = tone() + 40;
    Object.assign(s.style, { left: 540 - sw / 2 + 'px', top: 860 - sh / 2 + 'px', width: sw + 'px', height: sh + 'px', borderRadius: i % 3 ? '48px' : '50%', background: `rgb(${st},${st},${st})` });
    p.appendChild(s);
    for (let k = 0; k < 2; k++){
      const bar = document.createElement('i'); const bw = 300 + r() * 360;
      Object.assign(bar.style, { left: 540 - bw / 2 + 'px', top: 1330 + k * 70 + 'px', width: bw + 'px', height: '34px', borderRadius: '17px', background: `rgb(${st - 20},${st - 20},${st - 20})` });
      p.appendChild(bar);
    }
    feed.appendChild(p);
  }
})();
const SNAP = [10.55, 11.08, 11.5, 11.86, 12.18, 12.48, 12.78, 13.1, 13.46, 13.95], LAND = 14.75;
function scrollOffset(t){
  if (t < SNAP[0]) return 0;
  for (let i = 0; i < SNAP.length; i++){
    const last = i === SNAP.length - 1, a = SNAP[i], b = last ? LAND : SNAP[i + 1];
    if (t < b) return 1920 * (i + (last ? E('back.out(1.3)')(prog(t, a, b)) : quartIO(clamp01(prog(t, a, b) / .78))));
  }
  return 1920 * NPOSTS;
}

/* ---------- Partículas e onda de choque ---------- */
const fx = $('#fx').getContext('2d');
const PARTS = (() => { const r = rng(42); return Array.from({ length: 130 }, () => {
  const phi = r() * Math.PI * 2, el = r() * .95 - .2, sp = 380 + r() * 1300;
  const c = r();
  return { vx: Math.cos(phi) * Math.cos(el) * sp, vy: -Math.sin(el) * sp + Math.sin(phi) * Math.cos(el) * sp * .22, life: .45 + r() * .8, size: 1.2 + r() * 2.8, rgb: c < .3 ? '222,186,140' : c < .55 ? '255,255,255' : '0,212,245' };
}); })();
function drawFX(t, m){
  fx.clearRect(0, 0, W, H);
  const dt = t - 18;
  if (dt < 0 || dt > 1.4) return;
  const cx = 425, cy = m.contactY;
  fx.save(); fx.globalCompositeOperation = 'lighter';
  const g = fx.createRadialGradient(cx, cy, 0, cx, cy, 260);
  g.addColorStop(0, `rgba(160,245,255,${.55 * Math.exp(-dt * 9)})`); g.addColorStop(1, 'rgba(0,212,245,0)');
  fx.fillStyle = g; fx.fillRect(cx - 260, cy - 260, 520, 520);
  for (const [delay, scale, a0] of [[0, 1, 1], [.07, .62, .55]]){
    const k = (dt - delay) / .8; if (k <= 0 || k >= 1) continue;
    const rx = 30 + 600 * scale * expoOut(k), a = Math.pow(1 - k, 1.4) * a0;
    fx.shadowColor = 'rgba(0,212,245,.9)'; fx.shadowBlur = 28;
    for (const [from, to, f] of [[Math.PI, Math.PI * 2, .35], [0, Math.PI, 1]]){
      fx.lineWidth = 7 * (1 - k) + 1; fx.strokeStyle = `rgba(0,212,245,${a * f})`;
      fx.beginPath(); fx.ellipse(cx, cy, rx, rx * .26, 0, from, to); fx.stroke();
      fx.lineWidth *= .3; fx.strokeStyle = `rgba(235,255,255,${a * f * .7})`; fx.stroke();
    }
  }
  fx.shadowBlur = 0; fx.lineCap = 'round';
  const pos = (p, s) => { const k = 3.2, e = (1 - Math.exp(-k * s)) / k; return [cx + p.vx * e, cy + p.vy * e + 300 * s * s]; };
  for (const p of PARTS){
    if (dt > p.life) continue;
    const a = Math.pow(1 - dt / p.life, 1.5), [x1, y1] = pos(p, dt), [x0, y0] = pos(p, Math.max(0, dt - .022));
    fx.strokeStyle = `rgba(${p.rgb},${a})`;
    fx.lineWidth = p.size; fx.beginPath(); fx.moveTo(x0, y0); fx.lineTo(x1 + .01, y1); fx.stroke();
  }
  fx.restore();
}

/* ---------- Grão de filme ---------- */
const gx = $('#grain').getContext('2d');
const GRAIN = Array.from({ length: 6 }, (_, k) => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'), im = x.createImageData(256, 256), r = rng(k + 11);
  for (let i = 0; i < im.data.length; i += 4){ const v = 128 + (r() - .5) * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  x.putImageData(im, 0, 0); return gx.createPattern(c, 'repeat');
});
function drawGrain(t){
  const f = (t >= 7 && t < 8) ? 210 : (t >= 17.5 && t < 18) ? 525 : Math.floor(t * FPS);
  const r = rng(f * 7 + 3);
  gx.setTransform(1, 0, 0, 1, -Math.floor(r() * 256), -Math.floor(r() * 256));
  gx.fillStyle = GRAIN[f % 6]; gx.fillRect(0, 0, W + 256, H + 256);
}

/* ---------- Símbolo (SVG real; só transformações) ---------- */
const NS = 'http://www.w3.org/2000/svg';
const host = $('#sym'); host.appendChild($('#simbolo').content.cloneNode(true));
const svg = host.querySelector('svg');
const L = [...svg.children].filter(e => e.tagName.toLowerCase() !== 'defs');
const wrap = list => { const g = document.createElementNS(NS, 'g'); list[0].before(g); list.forEach(e => g.appendChild(e)); return g; };
const pupil1 = wrap(L.slice(7, 9)), iris1 = wrap([L[6], pupil1]), eye1 = wrap([...L.slice(1, 6), iris1]);
const pupil2 = wrap(L.slice(11, 13)), iris2 = wrap([L[10], pupil2]), eye2 = wrap([L[9], iris2]);
const crown = wrap([L[0]]), horn = wrap([L[13]]);
const logoHost = $('#logo-host'); logoHost.appendChild($('#logo').content.cloneNode(true));
const hasLogo = !!logoHost.querySelector('svg');
const pglow = $('#pglow'); Object.assign(pglow.style, { left: PUP.x + 'px', top: PUP.y + 'px', width: PUP.r * 2 + 'px', height: PUP.r * 2 + 'px', margin: `${-PUP.r}px 0 0 ${-PUP.r}px` });

/* ---------- Texto ---------- */
const cap = $('#cap');
const SENTS = [
  { out: 7.92, parts: [[7.12, 'Você'], [7.26, 'parou.', 1]] },
  { out: 8.85, parts: [[8.0, 'Faz'], [8.14, '7 segundos.', 1]] },
  { out: 10.95, parts: [[9.0, 'Isso tem nome:'], [9.48, 'retenção.', 1]] },
  { out: 14.5, parts: [[11.5, 'O post do seu negócio'], [12.5, 'ganha bem menos'], [12.86, 'que isso.', 1]] },
  { out: 17.12, parts: [[15.2, 'A não ser que'], [15.68, 'alguém pense nele assim.', 1]] },
];

/* ---------- Timeline GSAP (determinística: tudo por seek) ---------- */
const st = { zoom: 0, ui: 0, endR: 0 };
const tl = gsap.timeline({ paused: true });
const ft = (target, from, to, at) => tl.fromTo(target, from, { ...to, immediateRender: false }, at);
const wordIn = (el, at, op) => ft(el, { opacity: 0, y: 16, filter: 'blur(6px)' }, { opacity: op, y: 0, filter: 'blur(0px)', duration: .5, ease: 'power3.out' }, at);

for (const s of SENTS){
  const el = document.createElement('div'); el.className = 'sent'; cap.appendChild(el);
  for (const [at, txt, bold] of s.parts) txt.split(' ').forEach((w, j) => {
    const span = document.createElement('span'); span.className = bold ? 'w b' : 'w'; span.textContent = w; el.appendChild(span);
    wordIn(span, at + j * .11, bold ? 1 : .86);
  });
  gsap.set(el, { yPercent: -50 });
  ft(el, { opacity: 1, y: 0 }, { opacity: 0, y: -12, duration: .32, ease: 'power2.in' }, s.out);
}

ft(st, { zoom: 0 }, { zoom: 1, duration: 2.1, ease: 'power3.inOut' }, 8.0);
ft(st, { ui: 0 }, { ui: 1, duration: .8, ease: 'power2.out' }, 8.8);
ft(st, { ui: 1 }, { ui: 0, duration: .7, ease: 'power2.in' }, 14.95);
ft(st, { zoom: 1 }, { zoom: 0, duration: 2.15, ease: 'power3.inOut' }, 15.0);

gsap.set(host, { scale: SYM.s });
gsap.set(eye1, { scale: 0, svgOrigin: '79.03 111.74' });
gsap.set(eye2, { scale: 0, svgOrigin: '196.99 114.02' });
gsap.set(crown, { scale: 0, svgOrigin: '131 84' });
gsap.set(horn, { scale: 0, svgOrigin: '214 62' });
ft(eye1, { scale: .4, opacity: 0 }, { scale: 1, opacity: 1, duration: .6, ease: 'elastic.out(1,.5)' }, 19.0);
ft(eye2, { scale: 0 }, { scale: 1, duration: .75, ease: 'elastic.out(1.1,.4)' }, 19.28);
ft(crown, { scale: 0 }, { scale: 1, duration: .5, ease: 'back.out(2.2)' }, 19.4);
ft(horn, { scale: 0 }, { scale: 1, duration: .45, ease: 'back.out(3)' }, 19.48);
for (const [iris, o] of [[iris1, '72.15 114.02'], [iris2, '196.99 114.32']]){
  ft(iris, { scaleY: 1, svgOrigin: o }, { scaleY: .06, duration: .075, ease: 'power2.in' }, 19.74);
  ft(iris, { scaleY: .06, svgOrigin: o }, { scaleY: 1, duration: .14, ease: 'power2.out' }, 19.815);
}
ft([pupil1, pupil2], { x: 0, y: 0 }, { x: -3, y: -2.5, duration: .25, ease: 'power2.out' }, 19.45);
ft([pupil1, pupil2], { x: -3, y: -2.5 }, { x: 0, y: 0, duration: .3, ease: 'power2.inOut' }, 19.98);

ft(st, { endR: 0 }, { endR: 1, duration: .8, ease: 'expo.inOut' }, 20.0);
ft(host, { y: 0, scale: SYM.s }, { y: -92, scale: 2.15, duration: .85, ease: 'power3.inOut' }, 20.15);
if (hasLogo){
  ft(host, { opacity: 1 }, { opacity: 0, duration: .35, ease: 'power2.in' }, 20.4);
  ft(logoHost, { opacity: 0, scale: .85 }, { opacity: 1, scale: 1, duration: .7, ease: 'back.out(1.6)' }, 20.5);
}
'Dê um boop na sua empresa.'.split(' ').forEach((w, j) => {
  const span = document.createElement('span'); span.className = 'w'; span.textContent = w; $('#cta').appendChild(span);
  wordIn(span, 20.8 + j * .09, 1);
});
ft('#foot', { opacity: 0, y: 10 }, { opacity: .72, y: 0, duration: .6, ease: 'power2.out' }, 21.5);
ft([pupil1, pupil2], { x: 0, y: 0 }, { x: 1.5, y: 4.5, duration: .35, ease: 'power2.inOut' }, 21.1);
ft([pupil1, pupil2], { x: 1.5, y: 4.5 }, { x: 0, y: 0, duration: .4, ease: 'power2.inOut' }, 22.7);
tl.set({}, {}, DUR);

/* ---------- Quadro ---------- */
const realImg = $('#real'), scan = $('#scan'), intro = $('#intro');
const world = $('#world'), phone = $('#phone'), screen = $('#screen'), igui = $('#igui'), island = $('#island'), endbg = $('#endbg');
function frame(t){
  tl.seek(t, false);
  const m = macroState(t);
  drawGL(m);
  drawFX(t, m);
  drawGrain(t);
  // 0–7 s: vídeo real. 7–8 s: o quadro real congela e o CG o substitui numa varredura de cima para baixo
  const sc = E('power2.inOut')(prog(t, 7.3, 7.95));
  realImg.style.display = t < 7.95 ? 'block' : 'none';
  realImg.style.clipPath = `inset(${sc * 100}% 0 0 0)`;
  scan.style.top = sc * 1920 + 'px';
  scan.style.opacity = t > 7.3 && t < 7.95 ? 1 : 0;
  intro.style.display = t < 7 ? 'block' : 'none';

  const z = st.zoom, s = lerp(1, .5, z), fl = z * Math.sin(t * 1.25) * 8;
  world.style.transform = z ? `perspective(2400px) translate(${-205 * z}px, ${-14 * z + fl}px) rotateY(${z * (7 + 1.5 * Math.sin(t * .8))}deg) rotateX(${z * 3}deg) scale(${s})` : 'none';
  phone.style.visibility = z ? 'visible' : 'hidden';
  screen.style.borderRadius = 118 * z + 'px';
  igui.style.opacity = island.style.opacity = st.ui;

  const o = scrollOffset(t);
  feed.style.transform = `translateY(${-o}px)`;
  macro.style.transform = `translateY(${o < 1920 * 1.5 ? -o : 1920 * NPOSTS - o}px)`;
  const v = Math.abs(scrollOffset(t + 1 / 60) - scrollOffset(t - 1 / 60)) * 30;
  const blur = Math.min(70, v * .012);
  vStd.setAttribute('stdDeviation', `0 ${blur.toFixed(2)}`);
  scroller.style.filter = blur > .5 ? 'url(#vblur)' : 'none';

  pglow.style.opacity = t < 19 ? 0 : 1 - p2i(prog(t, 19.02, 19.45));
  endbg.style.clipPath = `circle(${st.endR * 2300}px at 540px 860px)`;
}

window.ready = document.fonts.ready.then(() => frame(0));
window.seek = t => { frame(t); return new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))); };

if (!RENDER){
  const stage = $('#stage');
  const fit = () => { const k = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `translate(${(innerWidth - W * k) / 2}px, ${(innerHeight - H * k) / 2}px) scale(${k})`; };
  fit(); addEventListener('resize', fit);
  const au = new Audio('boop-que-nao-chega.wav'); au.loop = true;
  let t0 = performance.now();
  addEventListener('click', () => { au.currentTime = 0; t0 = performance.now(); au.play().catch(() => {}); });
  (function loop(){
    const t = au.paused ? ((performance.now() - t0) / 1000) % DUR : au.currentTime % DUR;
    if (t < 7){ if (Math.abs(intro.currentTime - t) > .15) intro.currentTime = t; if (intro.paused) intro.play().catch(() => {}); } else intro.pause();
    frame(t); requestAnimationFrame(loop);
  })();
}
